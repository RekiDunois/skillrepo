name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Install packaged skillrepo
        shell: bash
        run: |
          set -euo pipefail
          package="$(npm pack --silent)"
          npm install -g "./$package"
          command -v skillrepo
      - name: Install OpenCode
        run: npm install -g opencode-ai
      - name: Build external agent symlink regression fixture
        shell: bash
        env:
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/opencode
        run: |
          set -euo pipefail
          external="$RUNNER_TEMP/external-agent-repo/agents"
          mkdir -p "$OPENCODE_CONFIG_DIR/agents" "$external"
          cat > "$external/symlink-probe-two.md" <<'EOF'
          ---
          description: external OpenCode symlink probe
          mode: subagent
          ---
          External probe without an explicit stable name.
          EOF
          ln -s "$external" "$OPENCODE_CONFIG_DIR/agents/manual-agent-repo"
          opencode agent list >/dev/null
          skillrepo doctor
      - name: Build fixture repo
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/fixture-repo"
          mkdir -p "$repo/skills/fixture-skill" "$repo/agents"
          cat > "$repo/skills/fixture-skill/SKILL.md" <<'EOF'
          ---
          name: fixture-skill
          description: CI fixture skill
          ---
          Test fixture.
          EOF
          cat > "$repo/agents/fixture-worker.md" <<'EOF'
          ---
          name: fixture-worker
          description: CI fixture agent: unquoted colon regression
          mode: subagent
          ---
          Test fixture.
          EOF
      - name: Register fixture with repo-specific post-check
        shell: bash
        env:
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/opencode
        run: |
          set -euo pipefail
          skillrepo register "$RUNNER_TEMP/fixture-repo"
          skillrepo register "$RUNNER_TEMP/fixture-repo"
          skillrepo doctor
      - name: Verify initial discovery through OpenCode
        shell: bash
        env:
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/opencode
        run: |
          set -euo pipefail
          opencode agent list | grep -F 'fixture-worker'
          opencode debug skill | grep -F 'fixture-skill'
      - name: Verify new components require no re-register
        shell: bash
        env:
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/opencode
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/fixture-repo"
          mkdir -p "$repo/skills/dynamic-skill"
          cat > "$repo/skills/dynamic-skill/SKILL.md" <<'EOF'
          ---
          name: dynamic-skill
          description: dynamic CI fixture skill
          ---
          Dynamic fixture.
          EOF
          cat > "$repo/agents/dynamic-worker.md" <<'EOF'
          ---
          name: dynamic-worker
          description: dynamic CI fixture agent
          mode: subagent
          ---
          Dynamic fixture.
          EOF
          opencode debug skill | grep -F 'dynamic-skill'
          opencode agent list | grep -F 'dynamic-worker'
      - name: Verify removed components disappear without re-register
        shell: bash
        env:
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/opencode
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/fixture-repo"
          rm -rf "$repo/skills/dynamic-skill"
          rm "$repo/agents/dynamic-worker.md"
          ! opencode debug skill | grep -F 'dynamic-skill'
          ! opencode agent list | grep -F 'dynamic-worker'
      - name: Verify unregister through packaged CLI
        shell: bash
        env:
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/opencode
        run: |
          set -euo pipefail
          skillrepo unregister "$RUNNER_TEMP/fixture-repo"
          ! opencode debug skill | grep -F 'fixture-skill'
          ! opencode agent list | grep -F 'fixture-worker'
      - name: Build migration fixture
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/migration-opencode"
          mkdir -p "$source/skill/migrated-skill/scripts" "$source/agents" "$source/lib"
          cat > "$source/skill/migrated-skill/SKILL.md" <<'EOF'
          ---
          name: migrated-skill
          description: migration CI fixture skill
          ---
          Migration fixture.
          EOF
          cat > "$source/skill/migrated-skill/scripts/run.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          echo migrated-runtime-ok
          EOF
          chmod +x "$source/skill/migrated-skill/scripts/run.sh"
          cat > "$source/agents/migrated-worker.md" <<'EOF'
          ---
          description: migration CI fixture agent
          mode: subagent
          ---
          Migration fixture.
          EOF
          cat > "$source/agents/migrated-helper.py" <<'EOF'
          print("migrated-agent-resource-ok")
          EOF
          printf 'export const migrated = true;\n' > "$source/lib/migrated.js"
          cat > "$RUNNER_TEMP/migration-plan.json" <<EOF
          {
            "schemaVersion": 1,
            "generatedFrom": { "sourceRoot": "$source" },
            "repositories": [
              {
                "id": "migrated-repo",
                "action": "CREATE_AND_MOVE",
                "skills": ["migrated-skill"],
                "agents": ["migrated-worker.md", "migrated-helper.py"],
                "libs": ["lib/migrated.js"]
              }
            ]
          }
          EOF
      - name: Verify migration dry-run is read-only
        shell: bash
        env:
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/migration-opencode
        run: |
          set -euo pipefail
          skillrepo migration apply \
            --plan "$RUNNER_TEMP/migration-plan.json" \
            --target-root "$RUNNER_TEMP/migration-repos"
          test -f "$RUNNER_TEMP/migration-opencode/skill/migrated-skill/SKILL.md"
          test -f "$RUNNER_TEMP/migration-opencode/agents/migrated-helper.py"
          test ! -e "$RUNNER_TEMP/migration-repos/migrated-repo/skills/migrated-skill/SKILL.md"
      - name: Verify migrated components through OpenCode
        shell: bash
        env:
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/migration-opencode
        run: |
          set -euo pipefail
          skillrepo migration apply \
            --plan "$RUNNER_TEMP/migration-plan.json" \
            --target-root "$RUNNER_TEMP/migration-repos" \
            --execute
          opencode debug skill | grep -F 'migrated-skill'
          opencode agent list | grep -F 'migrated-worker'
          test -f "$RUNNER_TEMP/migration-repos/migrated-repo/skills/migrated-skill/SKILL.md"
          test -f "$RUNNER_TEMP/migration-repos/migrated-repo/agents/migrated-worker.md"
          test -f "$RUNNER_TEMP/migration-repos/migrated-repo/agents/migrated-helper.py"
          grep -F 'name: migrated-worker' "$RUNNER_TEMP/migration-repos/migrated-repo/agents/migrated-worker.md"
          test ! -e "$RUNNER_TEMP/migration-opencode/skill/migrated-skill/SKILL.md"
          test -L "$RUNNER_TEMP/migration-opencode/skill/migrated-skill/scripts"
          test -L "$RUNNER_TEMP/migration-opencode/agents/migrated-helper.py"
          test -L "$RUNNER_TEMP/migration-opencode/lib/migrated.js"
          "$RUNNER_TEMP/migration-opencode/skill/migrated-skill/scripts/run.sh" | grep -F 'migrated-runtime-ok'
          python "$RUNNER_TEMP/migration-opencode/agents/migrated-helper.py" | grep -F 'migrated-agent-resource-ok'
          skillrepo doctor
